<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="scene">

        <!-- Background -->
        <div class="background-glow"></div>
        <div class="stars"></div>

        <!-- Floating Hearts -->
        <div class="heart-container"></div>


        <!-- =========================
             INTRO
        ========================== -->

        <section class="intro">

            <div class="intro-heart">
                ♥
            </div>

            <div class="intro-arrow">
                ➜
            </div>

        </section>


        <!-- =========================
             BALLOONS
        ========================== -->

        <div class="balloons">

            <div class="balloon balloon-pink"></div>

            <div class="balloon balloon-yellow"></div>

            <div class="balloon balloon-purple"></div>

            <div class="balloon balloon-pink2"></div>

        </div>


        <!-- =========================
             FIREWORKS
        ========================== -->

        <div class="fireworks">

            <div class="firework firework-one"></div>

            <div class="firework firework-two"></div>

            <div class="firework firework-three"></div>

        </div>


        <!-- =========================
             BIRTHDAY TITLE
        ========================== -->

        <section class="birthday-title">

            <div class="small-title">
                ✨ A special day for you ✨
            </div>

            <h1>
                Happy<br>
                Birthday
            </h1>

            <h2>
                Ma! 💗
            </h2>

        </section>

<!-- =========================
     ELEGANT CAKE
========================== -->

<section class="cake-area">

    <div class="cake">

        <!-- Candle -->
        <div class="candle">
            <div class="flame"></div>
        </div>

        <!-- Elegant Cake -->
        <div class="cake-tier cake-tier-top">
            <div class="frosting"></div>
            <div class="cake-decoration">✦</div>
            <div class="cake-decoration cake-decoration-right">✦</div>
        </div>

        <div class="cake-tier cake-tier-bottom">
            <div class="frosting"></div>

            <div class="cake-flower flower-left">✿</div>
            <div class="cake-flower flower-center">✿</div>
            <div class="cake-flower flower-right">✿</div>

            <div class="cake-gold-line"></div>
        </div>

        <!-- Plate -->
        <div class="cake-plate">
            <div class="plate-highlight"></div>
        </div>

    </div>

</section>


        <!-- =========================
             START BUTTON
        ========================== -->

        <button id="startButton">

            ✨ Start the Surprise ✨

        </button>


    </main>


    <script src="script.js"></script>

</body>

</html>
